<style>.grain-texture {
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuBfgh9sLRzHiChRDGb0AvHy5P1OvCp-l-axM9ITJZGM2hKGwna3dEvf6aeEYJppbn9jEyd4WcKNgpu9KTiJJhpHqKsU2kLH6VhjDQBkycqB83Gz3fLWonJfOhHwZK3-gJpW-fucjZk5-TuCTjwk-gNTjrLBLlnU1yKIIA2by7wB1k8ranDp--PI9D8wp26zAc3YzSaXBRx7lgoAD24Kz676TQiKRTuWgi7a31uUq1An8tjxcvYvPVXb_TJ_eCM6S-xpC4VhlPopr4c);
    opacity: 0.03;
    pointer-events: none
    }
.coral-glow {
    background: radial-gradient(circle at center, rgba(255, 107, 74, 0.15) 0%, rgba(255, 107, 74, 0) 70%)
    }
.glass-card {
    background: rgba(42, 28, 25, 0.6);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.05);
    box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.4)
    }
.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
input:focus + label, input:not(:placeholder-shown) + label {
    transform: translatey(-24px) scale(0.85);
    color: #e7c446;
    /* Warm Gold */
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-surface min-h-screen relative flex items-center justify-center p-6 overflow-x-hidden">
<!-- Background Elements -->
<div class="fixed inset-0 grain-texture z-0"></div>
<div class="fixed inset-0 coral-glow z-0"></div>
<!-- Decorative Connectors -->
<svg class="fixed inset-0 w-full h-full opacity-10 pointer-events-none z-0" xmlns="http://www.w3.org/2000/svg">
<path d="M-100,200 C150,300 350,100 600,400 S950,700 1300,500" fill="none" stroke="#97d3b3" stroke-width="2"></path>
<path d="M1400,100 C1100,300 900,100 600,500 S200,800 -100,600" fill="none" stroke="#97d3b3" stroke-width="2"></path>
</svg>
<main class="relative z-10 w-full max-w-[560px]">
<!-- Glassmorphism Card -->
<div class="glass-card rounded-[24px] p-8 md:p-12 transition-all duration-500 hover:translate-y-[-4px]">
<!-- Logo Row -->
<div class="flex items-center gap-3 mb-8">
<span class="material-symbols-outlined text-primary-container text-[40px]" data-icon="flight_takeoff">flight_takeoff</span>
<span class="font-display-lg text-primary text-3xl tracking-tight">Traveloop</span>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-on-surface mb-10 text-[28px] leading-tight">Create Your Account</h1>
<form class="space-y-8">
<!-- Avatar Upload Zone -->
<div class="flex flex-col items-center mb-10">
<div class="relative group">
<div class="w-[100px] h-[100px] rounded-full border-2 border-dashed border-primary-container flex items-center justify-center bg-surface-container overflow-hidden transition-all duration-300 group-hover:scale-105 group-hover:bg-surface-container-high cursor-pointer">
<span class="material-symbols-outlined text-on-surface-variant text-3xl" data-icon="add_a_photo">add_a_photo</span>
<img class="absolute inset-0 w-full h-full object-cover opacity-0 group-hover:opacity-10" data-alt="A portrait of a stylish modern traveler in soft warm sunlight, with a sophisticated and professional feel consistent with high-end luxury lifestyle magazines. The lighting is golden and high-contrast, highlighting the textures of high-quality fabrics against a minimalist urban background with deep navy and coral accents in the periphery." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC-YjwIsR1rcfoapYgIwmbp4Je4PBMtbcQbZUUJ-48bHubOJYJp7e3SxMncqhU37UZD9kHnkVAmtMHVZUj4DPveTa-lFmKhqcTMFiFmFqcAvDNKUTM2QRgIBAVfaP-iuALdk_a1kDO6CN8BJZMMxj4C6q58zhKjWPM4y-ckMMQMft38CzqCBH052E-fHXE3Cgl2y5f1r27j-LlLH7Fd4jIQNkCtblf7UMcgkv2hoNonWI0cuK-YnglJC9-XU8GE0XkkVR0XV3Hp550"/>
</div>
<div class="absolute -bottom-2 -right-2 bg-primary-container text-on-primary rounded-full p-1 shadow-lg">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</div>
</div>
<p class="font-body-sm text-on-surface-variant mt-3 uppercase tracking-[0.1em] text-[10px]">Upload Profile Picture</p>
</div>
<!-- Input Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-8">
<!-- Name -->
<div class="relative">
<input class="w-full bg-background border-none rounded-lg px-4 py-3 text-on-surface font-body-md focus:ring-1 focus:ring-primary-container transition-all peer" id="name" placeholder=" " type="text"/>
<label class="absolute left-4 top-3 text-on-surface-variant font-body-sm transition-all pointer-events-none" for="name">Full Name</label>
</div>
<!-- Email -->
<div class="relative">
<input class="w-full bg-background border-none rounded-lg px-4 py-3 text-on-surface font-body-md focus:ring-1 focus:ring-primary-container transition-all peer" id="email" placeholder=" " type="email"/>
<label class="absolute left-4 top-3 text-on-surface-variant font-body-sm transition-all pointer-events-none" for="email">Email Address</label>
</div>
<!-- Phone -->
<div class="relative">
<input class="w-full bg-background border-none rounded-lg px-4 py-3 text-on-surface font-body-md focus:ring-1 focus:ring-primary-container transition-all peer" id="phone" placeholder=" " type="tel"/>
<label class="absolute left-4 top-3 text-on-surface-variant font-body-sm transition-all pointer-events-none" for="phone">Phone Number</label>
</div>
<!-- Location -->
<div class="relative">
<input class="w-full bg-background border-none rounded-lg px-4 py-3 text-on-surface font-body-md focus:ring-1 focus:ring-primary-container transition-all peer" id="location" placeholder=" " type="text"/>
<label class="absolute left-4 top-3 text-on-surface-variant font-body-sm transition-all pointer-events-none" for="location">Current City</label>
</div>
</div>
<!-- Register Button -->
<button class="w-full bg-primary-container text-on-primary-fixed py-4 rounded-xl font-body-lg font-bold flex items-center justify-center gap-2 transition-all duration-300 hover:shadow-[0_0_20px_rgba(255,107,74,0.4)] active:scale-95" type="submit">
                    Register User
                    <span class="material-symbols-outlined" data-icon="flight">flight</span>
</button>
</form>
<!-- Login Link -->
<div class="mt-8 text-center">
<p class="font-body-sm text-on-surface-variant">
                    Already have an account? 
                    <a class="text-secondary hover:text-secondary-fixed transition-colors ml-1 font-medium" href="#">Log in here</a>
</p>
</div>
</div>
<!-- Footnote -->
<p class="mt-6 text-center text-on-surface-variant/40 font-label-mono text-[10px] tracking-widest uppercase">
            © 2024 Traveloop Concierge Services
        </p>
</main>
</body></html>
